<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DiamondNews | Cricket News, Match Updates & Blog</title>

  <meta
    name="description"
    content="DiamondNews - Latest cricket news, match updates, live scores, tournament news, player stories and cricket blogs."
  />

  <style>
    :root {
      --green: #075b43;
      --green-dark: #043c2d;
      --green-light: #e9f7f1;
      --lime: #c9f13a;
      --red: #e53935;
      --gold: #f4b942;
      --white: #ffffff;
      --black: #101614;
      --text: #1b2521;
      --muted: #71807a;
      --border: #e4ebe7;
      --bg: #f5f7f6;
      --card: #ffffff;
      --shadow: 0 10px 35px rgba(0, 50, 35, 0.08);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      width: 100%;
      display: block;
    }

    button,
    input {
      font-family: inherit;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    /* =========================
       TOP BAR
    ========================== */

    .topbar {
      background: var(--green-dark);
      color: #d9eee7;
      font-size: 13px;
      padding: 8px 0;
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .top-links {
      display: flex;
      gap: 18px;
    }

    .top-links a:hover {
      color: var(--lime);
    }

    /* =========================
       HEADER
    ========================== */

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-main {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 25px;
      font-weight: 900;
      color: var(--green);
      white-space: nowrap;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: var(--lime);
      font-size: 23px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav a {
      color: #34433e;
      font-size: 14px;
      font-weight: 700;
    }

    nav a:hover {
      color: var(--green);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 180px;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 10px 15px;
      outline: none;
      background: #fafcfa;
    }

    .search-box input:focus {
      border-color: var(--green);
    }

    .menu-btn {
      display: none;
      border: 0;
      background: var(--green);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 20px;
    }

    /* =========================
       BREAKING NEWS
    ========================== */

    .breaking {
      background: var(--red);
      color: white;
      overflow: hidden;
    }

    .breaking-inner {
      display: flex;
      align-items: center;
      min-height: 42px;
    }
